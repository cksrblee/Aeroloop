[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroloop"
version = "0.1.0"
description = "AeroLoop - Conceptual Design and Simulation Environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "langchain",
    "langchain-openai",
    "langgraph",
    "langfuse",
    "chromadb"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "black",
    "isort"
]

[project.scripts]
aero-run = "aeroloop.cli.run:main"
